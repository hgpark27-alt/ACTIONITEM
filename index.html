<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Action Items</title>
  <link rel="icon" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
  <script>if (window.chrome && chrome.webview && window.__aiStrip) document.documentElement.classList.add('host');</script>
</head>
<body>
  <div id="home">
    <div id="app">
      <section id="login" hidden>
        <h1>Action Items</h1>
        <input id="nameInput" placeholder="이름" autocomplete="off" spellcheck="false">
        <button id="nameEnter" class="primary">시작</button>
        <p id="loginMsg" class="msg"></p>
      </section>

      <section id="main" hidden>
        <header>
          <button id="noteBtn" class="icon" title="Note"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M6 2v12"/></svg></button>
          <button id="acctBtn" class="brand" title="계정"><span id="who"></span> <i id="conn" title="연결 상태"></i></button>
          <button id="weekBtn">주간업무</button>
          <span id="clocks"></span>
          <button id="copyBtn" class="primary">보고서 복사</button>
          <button id="pinBtn" class="icon" title="항상 위"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10.2 1.8l4 4-1.6.6-2.5 2.5-.3 3-1.3 1.3-2.9-2.9-3.2 3.2M4.4 7.3l4.3 4.3M4.4 7.3l1.3-1.3 3-.3 2.5-2.5z"/></svg></button>
          <button id="setBtn" class="icon" title="설정"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        </header>

        <!-- 주간 반복 업무: 위에서 내려오는 칸 (월~금) -->
        <section id="week">
          <div class="wday" data-d="mon"><b>월</b><ul class="wlist"></ul></div>
          <div class="wday" data-d="tue"><b>화</b><ul class="wlist"></ul></div>
          <div class="wday" data-d="wed"><b>수</b><ul class="wlist"></ul></div>
          <div class="wday" data-d="thu"><b>목</b><ul class="wlist"></ul></div>
          <div class="wday" data-d="fri"><b>금</b><ul class="wlist"></ul></div>
        </section>

        <input id="quick" autocomplete="off" spellcheck="false" placeholder="Enter">

        <section id="memoZone" class="group" data-zone="memo">
          <h3>Memo <span id="memoCnt" class="cnt"></span></h3>
          <ul class="items" id="memoList"></ul>
        </section>

        <section id="actionZone">
          <h3>Action Items</h3>
          <div id="list"></div>
          <button id="oldBtn" class="link"></button>
        </section>

        <!-- 왼쪽 노트: 생각나는 대로 적고 → 줄 단위로 메모로 보냄 -->
        <aside id="note" hidden>
          <div class="notehead"><span>Note</span><button id="noteU" class="icon" title="밑줄 (Ctrl+U)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 2.5v5a3 3 0 0 0 6 0v-5M4 13.5h8"/></svg></button></div>
          <div id="noteText" contenteditable="true" spellcheck="false"></div>
        </aside>

        <!-- 끄는 동안만 화면 아래에 뜨는 놓을 곳 -->
        <div id="chips">
          <div class="chiprow"><span class="lbl">분류</span><span id="catChips"></span></div>
        </div>
      </section>
      <div id="pop" hidden></div>
      <div id="toast" hidden></div>
    </div>
  </div>
  <p id="pipNote" hidden>미니 창에서 사용 중입니다. <button id="unpin">이 창으로 돌아오기</button></p>
  <script type="module" src="app.js"></script>
</body>
</html>
